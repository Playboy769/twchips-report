name: Daily data update

on:
  schedule:
    # 13:00 UTC = 21:00 Taipei — comfortably after TWSE/TAIFEX finalize same-day stats
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install twchips
        run: pip install git+https://github.com/catcat222222/twchips

      - name: Run incremental fetch + rebuild
        run: python build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "no changes, nothing to commit"
            exit 0
          fi
          git add index.html data/history.json data/maintenance.json
          git commit -m "chore: daily data update $(date -u +%Y-%m-%d)"
          git push
